name: Render a film

# Render a finished film run to MP4 on GitHub's machines, started by hand
# (Actions tab > Render a film > Run workflow; this also works from the
# GitHub mobile app) or by the studio when GitHub is connected.
# The film, its Shorts and thumbnails are published as a release of this
# repository (private when the repository is private; release files do not
# count against the 500 MB Actions storage of the free plan). The small files
# (thumbnails, captions, report) are also attached to the run for 30 days.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID  narration; without them the film renders without a voice
# Optional music: commit one track per cue as music/<film id>/M01.mp3 ...

on:
  workflow_dispatch:
    inputs:
      film_id:
        description: "Film ID (from the studio; the long ID in the film page address)"
        required: true
      site:
        description: "Site address"
        required: true
        default: "https://ai.zupona.com"
      resolution:
        description: "Picture size"
        type: choice
        options: ["1920x1080", "1280x720"]
        default: "1920x1080"

permissions:
  contents: write  # to publish the release with the film

concurrency:
  group: render-${{ github.event.inputs.film_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FILM_ID: ${{ inputs.film_id }}
      SITE: ${{ inputs.site }}
      RESOLUTION: ${{ inputs.resolution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the inputs
        run: |
          [[ "$FILM_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::The film ID must be the 36-character ID from the studio."; exit 1; }
          [[ "$SITE" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::The site must look like https://ai.zupona.com"; exit 1; }
          [[ "$RESOLUTION" =~ ^[0-9]{3,4}x[0-9]{3,4}$ ]] || { echo "::error::Bad resolution."; exit 1; }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null && ffmpeg -version | head -1
      - name: Record the narration (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          mkdir -p voice
          if [ -n "$ELEVENLABS_API_KEY" ] && [ -n "$ELEVENLABS_VOICE_ID" ]; then
            node render/voice.mjs --api "$SITE" --id "$FILM_ID" --voice-id "$ELEVENLABS_VOICE_ID" --out voice/
          else
            echo "::warning::No ELEVENLABS_API_KEY / ELEVENLABS_VOICE_ID secrets: the film renders without narration."
          fi
      - name: Render
        run: |
          node render/render-film.mjs --api "$SITE" --id "$FILM_ID" --voice voice/ --music "music/$FILM_ID" \
            --width "${RESOLUTION%x*}" --height "${RESOLUTION#*x}" --fps 30 --work .render --out "out/$FILM_ID.mp4"
      - name: Summary
        if: always()
        run: |
          if [ -f "out/$FILM_ID.report.json" ]; then
            node -e 'const r=require(process.argv[1]);const s=r.stats;console.log(`## ${r.file}\n\n${Math.round(r.durationSeconds/60)} min, ${r.width}×${r.height}. ${s.clips} clips, ${s.cards} cards, ${r.voicedScenes}/${r.narratedScenes} scenes voiced, ${r.musicCues.played}/${r.musicCues.scripted} music cues, ${r.licences.length} licensed clips.\n\n${r.warnings.length} warnings (see the report in the artifact).`)' "$PWD/out/$FILM_ID.report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the film as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=()
          for f in out/*.mp4 out/*.jpg out/*.srt out/*.json; do
            if [ "$(stat -c %s "$f")" -ge 2147000000 ]; then echo "::warning::$f is over 2 GB and was not published; render at 1280x720."; else files+=("$f"); fi
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::Nothing was rendered."; exit 1; }
          tag="film-${FILM_ID:0:8}-${GITHUB_RUN_NUMBER}"
          printf 'Film %s, rendered from %s.\n\nThe .mp4 is the film; SH-* are the Shorts (9:16), FB-* the Facebook cut (4:5), TH-* the thumbnails for YouTube Test & Compare, and the .report.json lists every clip with its licence page.\n' "$FILM_ID" "$SITE" > notes.md
          gh release create "$tag" "${files[@]}" --prerelease --title "Film $FILM_ID" --notes-file notes.md --target "$GITHUB_SHA"
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-${{ inputs.film_id }}
          path: |
            out/*.jpg
            out/*.srt
            out/*.json
          retention-days: 30
          if-no-files-found: warn
