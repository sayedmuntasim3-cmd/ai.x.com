name: Voiceover film

# A creator's finished voiceover (ElevenLabs, their own voice, or a Quran
# recitation) becomes a film. Started by the studio (worker/voice-api.mjs) after
# the upload; the words of the recording are the script, the pictures follow them.
# The runner never holds the studio key: it reads the one recording and reports
# with the ticket the Worker gave it (render/voice-runner.mjs).
# Steps: intake, pause tightening, speech-to-text (faster-whisper, free, on this
# runner), understanding, mastering, pictures (free licensed archives), render
# from the one recording (render/render-film.mjs --one-track), final check, and
# the MP4 goes back to the studio (private R2). Nothing is published.
# A narration's picture renders in 8 parts on 8 runners at once
# (render-chunked.yml); the sound is mixed once over the whole film.
# Quran: verbatim Tanzil text, the reciter's own voice only (never synthesized),
# no music, cuts only in measured silence, and the film waits for a scholar's review.
#
# Optional repository secrets: PEXELS_API_KEY, PIXABAY_API_KEY, SMITHSONIAN_API_KEY (more free stock),
# EUROPEANA_API_KEY, NARA_API_KEY, DVIDS_API_KEY (open archives; NARA results are never cached, per its terms).

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: "Voiceover ID (from the studio)"
        required: true
      site:
        description: "Site address"
        required: true
        default: "https://ai.zupona.com"
      ticket:
        description: "The Worker's ticket for this one recording (set by the studio)"
        required: true
      kind:
        description: "narration or quran"
        default: "narration"
      ext:
        description: "File extension of the recording"
        default: "mp3"
      topic:
        description: "What the film is about (optional)"
        default: ""
      quran:
        description: 'Quran only: {"surah":93,"ayat":"1-11","reciter":"..."}. Leave surah out and the passage is found from the recording (several surahs are fine).'
        default: ""
      resolution:
        description: "Picture size"
        default: "1920x1080"
      selftest:
        description: 'Self-test: "yes" makes a short spoken sample here and sends nothing to the studio'
        default: ""

run-name: "Voiceover film ${{ inputs.voice_id }}"

permissions:
  contents: read

concurrency:
  group: voice-${{ inputs.voice_id }}
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      args: ${{ steps.prepare.outputs.args }}
      # How many runners render the picture: from the film's own length (a 40-minute film gets 16).
      parts: ${{ steps.prepare.outputs.parts }}
    env:
      SITE: ${{ inputs.site }}
      VOICE_ID: ${{ inputs.voice_id }}
      VOICE_TICKET: ${{ inputs.ticket }}
      KIND: ${{ inputs.kind }}
      EXT: ${{ inputs.ext }}
      TOPIC: ${{ inputs.topic }}
      QURAN: ${{ inputs.quran }}
      RESOLUTION: ${{ inputs.resolution }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ZUPONA_PYTHON: python
      # The Quran recognizer (Whisper base fine-tuned on recitation, Apache-2.0), used only when no surah is given.
      # transcribe.py converts it once to CTranslate2 and keeps it in ~/.cache/zupona-stt.
      QURAN_STT_MODEL: tarteel-ai/whisper-base-ar-quran
      ZUPONA_STT_BATCH: "8"
      ZUPONA_MEDIA_CONCURRENCY: "6"
      VOICE_SELFTEST: ${{ inputs.selftest == 'yes' && '1' || '' }}
    steps:
      - name: Check the inputs
        run: |
          echo "t0=$(date +%s)" > "$RUNNER_TEMP/film-timing.env"
          echo "::add-mask::$VOICE_TICKET"
          [[ "$VOICE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::Bad voiceover ID."; exit 1; }
          [[ "$SITE" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::Bad site."; exit 1; }
          [[ "$KIND" =~ ^(narration|quran)$ ]] || { echo "::error::kind must be narration or quran."; exit 1; }
          [[ "$EXT" =~ ^(mp3|wav|m4a|aac|flac|ogg|opus|webm)$ ]] || { echo "::error::Bad extension."; exit 1; }
          [[ "$RESOLUTION" =~ ^[0-9]{3,4}x[0-9]{3,4}$ ]] || { echo "::error::Bad resolution."; exit 1; }
          [ -z "$VOICE_SELFTEST" ] || [[ "$KIND/$EXT" = narration/wav ]] || { echo "::error::The self-test is a narration in wav."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tell the studio a machine took it
        run: echo started > .stage && node render/voice-runner.mjs progress --stage started
      - name: Install the code's packages
        # local/voice-film.mjs imports worker/brain.mjs, which loads @anthropic-ai/sdk (never called: free brains only).
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install ffmpeg and speech-to-text (faster-whisper)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q faster-whisper==1.2.1
          [ -z "$VOICE_SELFTEST" ] || sudo apt-get install -y -qq espeak-ng > /dev/null
          if [ "$KIND" = quran ]; then
            # The recitation is aligned to the verbatim Tanzil text (local/stt/align.py), and pictures pass the adab guard.
            # torch and transformers also convert the Quran recognizer (QURAN_STT_MODEL) to CTranslate2 on first use.
            pip install -q "opencv-python-headless==4.10.0.84" pillow
            pip install -q --index-url https://download.pytorch.org/whl/cpu torch
            pip install -q transformers
          fi
      - name: Keep the speech-to-text model between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/zupona-stt
          key: whisper-${{ inputs.kind }}-v1
      - name: Fetch the recording (private, with this run's ticket)
        run: |
          echo intake > .stage
          if [ -n "$VOICE_SELFTEST" ]; then
            # A short spoken sample made here (espeak-ng), so the whole film path runs without a studio recording.
            espeak-ng -v en-us -s 140 -w "in.$EXT" "Lighthouses have guarded dangerous coasts for more than two thousand years. The first great one stood at Alexandria in Egypt, a tower of stone with a fire burning at its top. Sailors far out at sea could see its glow at night and smoke by day. Later towers were built of brick and iron, and their keepers climbed hundreds of steps each evening to light the lamps. In the nineteenth century, a French engineer named Augustin Fresnel designed a lens of glass rings that bent the light into a single strong beam. A lamp that once reached a few miles could now be seen from twenty miles away. Keepers lived lonely lives on rocks and islands, cleaning the glass, winding the clockwork that turned the light, and writing every storm into their logbooks. Today most lighthouses run on their own, with electric lamps and sensors, and satellites guide the ships. Yet the old towers still stand on cliffs and harbours around the world, white and red against the sea, reminding us how people once kept each other safe in the dark."
            exit 0
          fi
          node render/voice-runner.mjs fetch --out "in.$EXT" 2>&1 | tee step.log && test "${PIPESTATUS[0]}" = 0
      - name: Listen, write down every word, understand, master, find pictures
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
        run: |
          echo words > .stage
          # Free modern stock (Pixabay) with the Worker's own key, relayed for this one recording.
          [ -n "$VOICE_SELFTEST" ] || export ZUPONA_STOCK_RELAY="$SITE/api/voice/$VOICE_ID/stock?ticket=$VOICE_TICKET"
          if [ "$KIND" = quran ]; then
            surah=$(node -e 'const q=JSON.parse(process.env.QURAN||"{}");if(Number.isInteger(q.surah)&&q.surah>=1&&q.surah<=114)console.log(q.surah)')
            ayat=$(node -e 'const q=JSON.parse(process.env.QURAN||"{}");console.log(/^\d{1,3}(-\d{1,3})?$/.test(q.ayat||"")?q.ayat:"")')
            # The reviewer's ayah marks (taps on the uploaded recording): confirmed times, so no pause is shortened.
            marks=""
            if node -e 'const q=JSON.parse(process.env.QURAN||"{}");if(!q.marks)process.exit(1);require("fs").writeFileSync("marks.json",JSON.stringify(q.marks))'; then marks="--marks marks.json --tighten off"; fi
            # No surah typed: the recitation is written down by the Quran recognizer and the passage is found from
            # its words, across surah boundaries, a juz at a time if need be (engine/src/quran-locate.mjs).
            find=()
            if [ -n "$surah" ]; then find=(--surah "$surah"); else find=(--stt faster-whisper --model "$QURAN_STT_MODEL" --language ar); fi
            node local/voice-film.mjs --audio "in.$EXT" --kind quran "${find[@]}" ${ayat:+--ayat "$ayat"} --master mosque-hall $marks --out run 2>&1 | tee voice-film.log step.log
            rc="${PIPESTATUS[0]}"
            if [ "$rc" = 3 ] && [ -z "$surah" ]; then
              # The locator never guesses: it stops with a question. Say what the owner must do, in his languages.
              node --input-type=module -e 'import { msg } from "./engine/src/messages.mjs"; console.log("::error::" + msg("quran.ask.needSurah").en); console.log("::error::" + msg("quran.ask.needSurah").bn);' | tee -a voice-film.log
              exit 1
            fi
            test "$rc" = 0
          else
            # The Craft Ledger (R2, through the Worker): earlier films' targets for the shot plan and the critic.
            mkdir -p run && { node render/voice-runner.mjs ledger --out run/craft-ledger.json || echo "::warning::The craft ledger could not be read; the house standard sets the targets."; }
            node local/voice-film.mjs --audio "in.$EXT" --kind narration --stt faster-whisper --model base.en --language en --media --master dry ${TOPIC:+--topic "$TOPIC"} --ledger run/craft-ledger.json --ledger-record off --film-id "$VOICE_ID" --out run 2>&1 | tee voice-film.log step.log
          fi
          test "${PIPESTATUS[0]}" = 0
          node render/voice-runner.mjs summary --run run
          echo "words=$(date +%s)" >> "$RUNNER_TEMP/film-timing.env"
      - name: Keep the picture-ranking model and every thumbnail's embedding between runs (OpenCLIP, CPU)
        if: inputs.kind == 'narration'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zupona
          # The embeddings are keyed by URL and model inside the folder (rank.py), so a new cache version still
          # reuses them: restore-keys falls back to the previous one instead of downloading 135,000 thumbnails again.
          key: asset-rank-v2
          restore-keys: |
            asset-rank-v1
            asset-rank-
      - name: Look at the pictures (OpenCLIP chooses on-topic, in the film's world)
        if: inputs.kind == 'narration'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Free Groq: writes each shot's searches from its sentence, and its free eyes are the critic (none when unset).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo pictures > .stage
          [ -n "$VOICE_SELFTEST" ] || export ZUPONA_STOCK_RELAY="$SITE/api/voice/$VOICE_ID/stock?ticket=$VOICE_TICKET"
          # The eyes never stop the film: if they cannot run, the plan's own picks stay (rerank.mjs prints why).
          if pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1 && pip install -q open_clip_torch==2.29.0 pillow numpy; then
            export HF_HOME="$HOME/.cache/zupona/hf" ZUPONA_RANK_CACHE="$HOME/.cache/zupona/asset-rank"
            # Speed knobs (mission S1), all with the same defaults in rerank.mjs: 40 candidates a shot before any
            # download, 24 parallel thumbnail fetches with their own 300 s limit, 64 images an embedding batch,
            # and the text-decisive skip (a clip whose tags carry all three searches is not looked at).
            export ZUPONA_CANDIDATE_CAP="${ZUPONA_CANDIDATE_CAP:-40}" ZUPONA_FETCH_WORKERS="${ZUPONA_FETCH_WORKERS:-24}" ZUPONA_EMBED_BATCH="${ZUPONA_EMBED_BATCH:-64}"
            node render/asset-rank/rerank.mjs --run run ${TOPIC:+--topic "$TOPIC"} 2>&1 | tee -a voice-film.log
          else
            echo "::warning::OpenCLIP could not be installed; the plan's picks stay."
          fi
          echo "pictures=$(date +%s)" >> "$RUNNER_TEMP/film-timing.env"
      - name: Quran pictures (adab guard; no living beings, no AI pictures)
        if: inputs.kind == 'quran'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          echo pictures > .stage
          node local/quran-media.mjs --run run --detect python --clip 2>&1 | tail -n 20
          node render/voice-runner.mjs summary --run run --stages pictures
      - name: Make the film from the one recording (Quran)
        if: inputs.kind == 'quran'
        run: |
          echo render > .stage
          node render/voice-runner.mjs progress --stage render
          mkdir -p out
          reciter=$(node -e 'console.log(String(JSON.parse(process.env.QURAN||"{}").reciter||""))')
          node render/quran-render.mjs --run run --audio run/master/mosque-hall.wav ${reciter:+--reciter "$reciter"} --out out/film.mp4 2>&1 | tee step.log
          test "${PIPESTATUS[0]}" = 0
      - name: Send the film to the studio (private, Quran)
        if: inputs.kind == 'quran'
        run: |
          echo deliver > .stage
          node render/voice-runner.mjs deliver --file out/film.mp4 --seconds "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/film.mp4)" --review --run run
      - name: Shorts (three vertical cuts of whole ayat; never fails the film)
        if: inputs.kind == 'quran'
        continue-on-error: true
        run: |
          # 30-55 s each, 9:16, the Arabic ayah and its Pickthall line burned in, the recitation only.
          node render/shorts.mjs --run run --film out/film.mp4 --kind quran --out shorts 2>&1 | tee shorts.log || echo "::warning::The Shorts could not be made; the film is unaffected."
      - name: Prepare the render (voice, free score); the parts render on 8 runners
        id: prepare
        if: inputs.kind == 'narration'
        run: |
          echo render > .stage
          node render/voice-runner.mjs progress --stage render
          voice=$(sed -n 's/^Mastered voice: \(.*\) (use it.*/\1/p; s/^Tightened voice: \(.*\) (use it.*/\1/p' voice-film.log | head -n 1)
          voice=$(realpath --relative-to=. "${voice:-in.$EXT}")
          case "$voice" in run/*|"in.$EXT") ;; *) echo "::error::The voice is outside the run folder: $voice" | tee step.log; exit 1 ;; esac
          # The free score (original music made here, never under a recitation) as a quiet bed under the voice.
          mkdir -p music && touch music/.keep
          [ -f run/s4.md ] && { node render/score-synth.mjs --run run --out music/ || echo "::warning::The free score could not be made; the film plays without music."; }
          echo "args=--run run --one-track $voice --words run/words.json --music music --width ${RESOLUTION%x*} --height ${RESOLUTION#*x} --fps 30" >> "$GITHUB_OUTPUT"
          # The picture renders in parts on parts runners at once: one part per 2.5 minutes of film, 2 to 16
          # (a 40-minute film: 16 parts, about 10 minutes of picture instead of 18 in 8). The parts meet on shot
          # boundaries and are joined with concat -c copy, so the frames are the same as one render.
          seconds=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$voice" 2>/dev/null || echo 0)
          parts=$(node -e 'const s=Number(process.argv[1])||0;console.log(Math.min(16,Math.max(2,Math.round(s/150))))' "$seconds")
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "The film is ${seconds} s long: $parts render parts." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "prepare=$(date +%s)" >> "$RUNNER_TEMP/film-timing.env"
          echo "parts=$parts" >> "$RUNNER_TEMP/film-timing.env"
      - uses: actions/upload-artifact@v4
        if: inputs.kind == 'narration'
        with:
          name: prep-${{ inputs.voice_id }}
          path: |
            run/
            music/
            in.${{ inputs.ext }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
      - name: Minutes per stage (listen and plan, pictures, prepare; the render parts and the join are their own jobs)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/film-timing.env" ] || exit 0
          set -a; . "$RUNNER_TEMP/film-timing.env"; set +a
          mkdir -p run
          node -e 'const e=process.env,n=(k)=>e[k]?Number(e[k]):null,m=(a,b)=>a!=null&&b!=null?Math.round((b-a)/6)/10:null;const t={listenAndPlan:m(n("t0"),n("words")),pictures:m(n("words"),n("pictures")),prepare:m(n("pictures")??n("words"),n("prepare")),renderParts:n("parts")??null};require("fs").writeFileSync("run/film-timing.json",JSON.stringify(t,null,1));console.log("Minutes per stage: "+JSON.stringify(t))' | tee -a "$GITHUB_STEP_SUMMARY"
          # The picture pass reports its own split (download, embed, search) in run/rank-C1.json.
          [ -f run/rank-C1.json ] && node -e 'const r=require("./run/rank-C1.json").summary;console.log("Pictures: "+JSON.stringify({seconds:r.seconds,candidates:r.candidates,textDecided:r.textDecided,searchPlan:r.searchPlan}))' | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Tell the studio what stopped it
        if: failure()
        run: |
          stage=$(cat .stage 2>/dev/null || echo started)
          # The failing step's own words: the gate's BLOCK lines first, else that step's last lines.
          why=$( (grep -h '^BLOCK:' step.log 2>/dev/null || tail -n 3 step.log 2>/dev/null) | head -n 3 | tr '\n' ' ' | cut -c1-300)
          node render/voice-runner.mjs progress --stage "$stage" --error "The film machine stopped${why:+: $why}. Details: $RUN_URL" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ inputs.voice_id }}
          path: |
            run/*.json
            run/*.md
            voice-film.log
            out/*.json
            out/*.srt
            shorts/
            shorts.log
          retention-days: 14
          if-no-files-found: warn

  render:
    needs: film
    if: inputs.kind == 'narration'
    uses: ./.github/workflows/render-chunked.yml
    with:
      artifact: prep-${{ inputs.voice_id }}
      args: ${{ needs.film.outputs.args }}
      # As many parts as the film's length earns (2-16): a long film's picture must not sit on one runner.
      parts: ${{ fromJSON(needs.film.outputs.parts || '8') }}
      # Before the film is blocked: fix the failing shots twice, then hand over a draft with reasons.
      autofix: 2
      out_artifact: film-${{ inputs.voice_id }}

  finish:
    needs: [film, render]
    if: always() && inputs.kind == 'narration' && needs.film.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE: ${{ inputs.site }}
      VOICE_ID: ${{ inputs.voice_id }}
      VOICE_TICKET: ${{ inputs.ticket }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RENDER_RESULT: ${{ needs.render.result }}
      VOICE_SELFTEST: ${{ inputs.selftest == 'yes' && '1' || '' }}
    steps:
      - run: echo "::add-mask::$VOICE_TICKET"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The parts rendered and joined
        run: |
          echo render > .stage
          [ "$RENDER_RESULT" = success ] || { echo "Rendering the film in parts stopped ($RENDER_RESULT)." | tee step.log; exit 1; }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: film-${{ inputs.voice_id }}
          path: out
      # The film is never taken away from the creator: a film the gate still blocks after the auto-fix rounds
      # is delivered as a DRAFT, marked, with the plain reasons — not as a released film, and no threshold moves.
      - name: Check the finished film
        id: gate
        run: |
          echo check > .stage
          node render/release-gate.mjs --report out/film.report.json --file out/film.mp4 2>&1 | tee step.log
          if [ "${PIPESTATUS[0]}" = 0 ]; then
            echo "passed=yes" >> "$GITHUB_OUTPUT"
            node render/voice-runner.mjs progress --stage check
          else
            echo "passed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::The film did not pass its quality check after the auto-fix rounds; it is delivered as a marked draft, never as a released film."
          fi
      - name: Send the film to the studio (private)
        run: |
          echo deliver > .stage
          if [ "${{ steps.gate.outputs.passed }}" = yes ]; then
            node render/voice-runner.mjs deliver --file out/film.mp4 --report out/film.report.json
          else
            node render/voice-runner.mjs deliver --file out/film.mp4 --report out/film.report.json --draft
          fi
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ inputs.voice_id }}
      - name: Shorts (three vertical cuts of the strongest moments; never fails the film)
        continue-on-error: true
        run: |
          # The picker reads the film's own words (run/words.json) and shot plan (run/shots.json); a Short that fails is
          # reported in shorts/shorts.json and skipped, and nothing here can stop the film from being delivered.
          node render/shorts.mjs --run run --film out/film.mp4 --out shorts 2>&1 | tee shorts.log || echo "::warning::The Shorts could not be made; the film is unaffected."
      - name: Teach the craft ledger (this film's critic measures, for the next film)
        run: node render/voice-runner.mjs ledger --report out/film.report.json || echo "::warning::The film is delivered, but the craft ledger could not record it."
      - name: Tell the studio what stopped it
        if: failure()
        run: |
          stage=$(cat .stage 2>/dev/null || echo render)
          why=$( (grep -h '^BLOCK:' step.log 2>/dev/null || tail -n 3 step.log 2>/dev/null) | head -n 3 | tr '\n' ' ' | cut -c1-300)
          node render/voice-runner.mjs progress --stage "$stage" --error "The film machine stopped${why:+: $why}. Details: $RUN_URL" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ inputs.voice_id }}-film
          path: |
            out/*.json
            out/*.srt
            shorts/
            shorts.log
          retention-days: 14
          if-no-files-found: warn
