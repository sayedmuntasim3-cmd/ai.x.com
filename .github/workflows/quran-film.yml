name: Quran film check

# A whole recitation film, end to end, on the runner, measured:
#  1. the CC0 recitation of Ad-Duha (archive.org jawad-farogi, given surah 93):
#     locate, master (mosque hall), meaning, shot list, licensed media with
#     the frame check, render at 1080p;
#  2. Yusuf 1-12 joined from single-ayah files with a public-domain mark,
#     rendered at 9:16.
# Printed between QURAN-FILM-BEGIN/END: length against the voice, loudness,
# true peak, black and frozen stretches, where the cuts are. The films and
# their reports are kept as run files for 7 days. Test audio is never
# committed. Pexels / Pixabay only with their free keys as secrets; nothing paid.

on:
  push:
    paths:
      - "render/quran-render.mjs"
      - ".github/workflows/quran-film.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and OpenCV
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "opencv-python-headless==4.10.0.84"
      - name: Ad-Duha, 1080p
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          curl -sSfL --retry 3 -o duha.mp3 https://archive.org/download/jawad-farogi/Az-Zuha.mp3
          node local/voice-film.mjs --audio duha.mp3 --surah 93 --master mosque-hall --out runs/duha > runs-duha.log 2>&1 || { tail -n 20 runs-duha.log; exit 1; }
          node local/quran-media.mjs --run runs/duha --detect python > runs/duha/media.log 2>&1 || true
          node render/quran-render.mjs --run runs/duha --audio runs/duha/master/mosque-hall.wav --reciter "Qari Jawad Farogi" --out films/duha-1080p.mp4 > runs/duha/render.log 2>&1 || echo duha >> failed.txt
      - name: Yusuf 1-12, 9:16
        if: always()
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node local/quran-locate.mjs --fetch quran-audio-verse-by-verse-by-sadaqat-ali-surah-012 --count 12 --out audio/yusuf
          node local/quran-locate.mjs --join audio/yusuf --surah 12 --ayat 1-12 --gap 0.6 --out sets/yusuf
          node local/voice-film.mjs --audio sets/yusuf/joined.wav --surah 12 --ayat 1-12 --opening basmala --master clean --out runs/yusuf > runs-yusuf.log 2>&1 || { tail -n 20 runs-yusuf.log; exit 1; }
          node local/quran-media.mjs --run runs/yusuf --detect python > runs/yusuf/media.log 2>&1 || true
          node render/quran-render.mjs --run runs/yusuf --audio runs/yusuf/master/clean.wav --format 9:16 --reciter "Syed Sadaqat Ali" --out films/yusuf-9x16.mp4 > runs/yusuf/render.log 2>&1 || echo yusuf >> failed.txt
      - name: Print what was measured
        if: always()
        run: |
          echo QURAN-FILM-BEGIN
          for r in duha yusuf; do
            echo "== $r"; grep -h "^QURAN-MEDIA " runs/$r/media.log 2>/dev/null | cut -c1-400
            grep -h "^QURAN-RENDER " runs/$r/render.log 2>/dev/null || tail -n 5 runs/$r/render.log 2>/dev/null
          done
          echo QURAN-FILM-END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-films
          path: |
            films/*.mp4
            runs/**/shots.md
            runs/**/media.md
            runs/**/meaning.md
            runs/**/credits.txt
            runs/**/manifest.json
            runs/**/render-report-*.json
            runs/**/quran-location.json
          retention-days: 7
      - name: Fail when a film failed its own checks
        run: if [ -s failed.txt ]; then cat failed.txt; exit 1; fi
