name: Engine checks

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-checks.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-checks.yml"

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Strict JSDoc type check
        run: npm run typecheck
